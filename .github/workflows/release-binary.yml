---
# yamllint disable rule:line-length
name: Release binary
'on':
  workflow_dispatch:
jobs:
  build-and-release:
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2.10.3
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - name: Cache Cabal build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.ghcup
            ~/.cabal/packages
            ~/.cabal/store
            ~/.ghc
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cabal-
      - name: Build
        run: |
          cabal update
          cabal build
      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-release
          cp "$(cabal list-bin phino)" dist-release/phino-${{ matrix.os }}
          chmod +x dist-release/phino-${{ matrix.os }}
      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item "$(cabal list-bin phino)" dist-release/phino-${{ matrix.os }}.exe
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist-release/phino-${{ matrix.os }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
